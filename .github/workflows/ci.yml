name: CI

on:
  push:
    branches: [main]
  pull_request:

# No API calls here: model runs cost money and need ANTHROPIC_API_KEY, so run.py stays manual
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check expected outputs against inputs
        run: uv run python tests/check_expected.py
