# Pricing parameters for the value calculation.

# The LLM never sees or computes prices. It returns exit_type;
# the value is computed from this file outside the model.
# Replace the defaults with your own buyout and resale numbers.

currency: CZK

# Exit price per m2 for the whole parcel (before share).
# null = no reliable public price, the parcel gets only a value band.
exit_price_czk_m2:
  road_class_2: 100        # state subsidy cap for regions 2026
  road_class_3: 60         # same source
  field_arable: 39.6       # Farmy.cz market report 2025, arable land average
  field_grassland: 30.3    # Farmy.cz market report 2025, permanent grassland average
  building_owner: null     # land under a third-party building, needs per-case valuation
  forest: null             # depends on stand age and access, needs per-case valuation
  local_road: null         # municipal buyout prices vary by municipality

# Value band used when the exit price is null.
value_band_without_price: [low, medium, high]

# Fixed costs per deal.
fixed_costs_czk:
  transaction: 5000        # guess: contract, cadastre fee, courier
  court_dissolution: 40000 # guess: expert valuation + court fee + lawyer

# Minimum margin for BUY_CANDIDATE: (value - offer_price) / value.
min_margin: 0.30
