[project]
name = "parcel-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4",
    "jsonschema>=4.23",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
